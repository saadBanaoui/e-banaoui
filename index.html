<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenue sur mon site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }
    h1 {
      color: #2c3e50;
    }
    p {
      color: #34495e;
      font-size: 1.2em;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <h1>👋 Bonjour, je suis Saad</h1>
  <p>Bienvenue sur mon site personnel hébergé avec GitHub Pages !</p>
  <a class="btn" href="https://github.com/saadelbanaoui" target="_blank">Voir mon GitHub</a>
</body>
</html>
