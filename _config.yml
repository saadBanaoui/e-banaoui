# Collections
collections:
  works:
    output: true
    permalink: /works/:name/

# Configuration des logs
log_level: info  # Réduit les logs de debug

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Configuration Sass
sass:
  quiet_deps: true
  silence_deprecations: [import]

# Configuration de performance
incremental: false
future: false

minima:
  skin: classic
  nav_pages:
    - about.md
    - projects.md
    - contact.md
  date_format: "%b-%d-%Y"
  show_excerpts: false
  social_links:
