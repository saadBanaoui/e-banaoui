# Site settings
# You can use the following variables in your templates:
#   {{ site.title }}
#   {{ site.email }}
#   {{ site.name }}
#   {{ site.description }}
#   {{ site.baseurl }}
#   {{ site.url }}
#   {{ site.github_url }}
#   {{ site.twitter_username }}
#   {{ site.lang }}

# Performance optimizations
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  profile: false
  ignore:
    envs: []

# Image optimization
image_optimization:
  enabled: true
  quality: 85
  progressive: true

# Font optimization
font_optimization:
  preload: true
  display: swap

# CLS optimization
cls_optimization:
  enabled: true
  reserve_space: true
  aspect_ratio: true

# Site information
title: Saad El Banaoui
email: saadelbanaoui@gmail.com
name: Saad El Banaoui
description: "Saad El Banaoui conçoit et développe des interfaces sobres, accessibles et durables. Une approche du numérique pensée pour l'usage, pas pour la surconsommation."
baseurl: "/e-banaoui"  # ou "" si ton site est à la racine
url: "https://saadbanaoui.github.io/e-banaoui/"
github_url: "https://github.com/saadbanaoui"
twitter_username: selbanaoui
lang: fr
locale: fr_FR

