  email: "saadelbanaoui@gmail.com"
  phone: "+33 7 61 86 10 77"
  address: "Valence, France"
  baseurl: "/e-banaoui"  # ou "" si ton site est à la racine
  url: "https://saadbanaoui.github.io/e-banaoui/"
  twitter_username: selbanaoui
  avatar: "assets/images/loogoSaad.svg"
  linkedin: "https://www.linkedin.com/in/saad-el-banaoui-a840742a/"
  github: "https://github.com/saadBanaoui"
  x: "https://x.com/selbanaoui"
  social_links:
    - title: github
      icon: github
      url: "https://github.com/saadBanaoui"
    - title: linkedin
      icon: linkedin
      url: "https://www.linkedin.com/in/saad-el-banaoui-a840742a/"
    - title: x
      icon: twitter-x
      url: "https://x.com/selbanaoui"
    - title: behance
      icon: behance
      url: "https://www.behance.net/saad-el-banaoui"
    - title: dribbble
      icon: dribbble
      url: "https://dribbble.com/saad-el-banaoui"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /misc/:year/:month/:day/:title/

# Collections
collections:
  works:
    output: true
    permalink: /works/:name/

# Defaults
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "works"
    values:
      layout: "work"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Configuration des logs
log_level: info  # Réduit les logs de debug

# Configuration Sass
sass:
  quiet_deps: true
  silence_deprecations: [import]

# Configuration de performance
incremental: false
future: false

# Theme configuration
theme: minima
minima:
  skin: classic
  nav_pages:
    - about.md
    - services.md
    - projects.md
    - blog.md
    - moto.md
    - contact.md
  date_format: "%d %b. %Y"
  locale: fr_FR
  show_excerpts: false
  social_links:
    - title: Saad at GitHub
      icon: github
      url: "https://github.com/saadBanaoui"
    - title: Saad at X (formerly Twitter)
      icon: x-twitter
      url: "https://x.com/selbanaoui"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

contact_url: "/contact/"