<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}

  <!-- Preconnect to external domains for faster resource loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- Preload critical fonts with font-display: swap for better LCP -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet"></noscript>

  <!-- Preload critical CSS for faster rendering -->
  <link rel="preload" href="{{ '/assets/css/style.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link id="main-stylesheet" rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></noscript>

  <!-- Preload critical images for LCP -->
  <link rel="preload" href="{{ '/assets/images/loogoSaad.svg' | relative_url }}" as="image" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/images/bg.webp' | relative_url }}" as="image" type="image/webp">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/images/favicon.webp' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">

  <!-- Load Remix Icons with preconnect -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

  {%- feed_meta -%}

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ '/sitemap.xml' | relative_url }}">

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  {%- include custom-head.html -%}

  <!-- GSAP pour les animations de navigation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Curseur personnalisé -->
  <script src="{{ '/assets/js/custom-cursor.js' | relative_url }}" defer></script>

  <!-- Navigation moderne -->
  <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>

</head>
